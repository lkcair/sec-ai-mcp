# Publish to PyPI (trusted publishing) and the MCP Registry (GitHub OIDC).
# Trigger: push a tag vX.Y.Z matching the version in sec_finance_ai.py, or run it by hand.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          version="$(grep -m1 '^version:' sec_finance_ai.py | awk '{print $2}')"
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag says ${GITHUB_REF_NAME#v} but sec_finance_ai.py says $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Same file as lkcair/sec-finance-ai
        run: |
          curl -fsSL "https://raw.githubusercontent.com/lkcair/sec-finance-ai/main/sec_finance_ai.py" -o upstream.py
          cmp upstream.py sec_finance_ai.py || { echo "run ./sync.sh first"; exit 1; }
          rm upstream.py

      - name: Stamp the version into server.json
        run: |
          jq --arg v "${{ steps.v.outputs.version }}" '.version = $v | .packages[0].version = $v' server.json > s.json
          mv s.json server.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # PyPI can take a moment to serve a new release to the registry's check
          for i in 1 2 3 4 5 6; do ./mcp-publisher publish && exit 0; sleep 20; done
          exit 1
